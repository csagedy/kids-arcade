<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>2048</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-noswipe">

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="score-chip"><span class="k-stat__label">Score</span><b class="k-stat__val" id="score">0</b></div>
        <div class="k-stat" id="best-chip"><span class="k-stat__label">Best</span><b class="k-stat__val" id="best">0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="undo-btn" class="k-btn k-btn--icon" data-k-icon="undo" aria-label="Undo" disabled></button>
      <button id="restart-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="New game"></button>
    </div>
  </header>

  <main class="k-stage">
    <div id="board" class="board k-fit" style="--k-aspect: 1">
      <div id="cells" class="cells"></div>
      <div id="tiles" class="tiles"></div>
    </div>
  </main>

  <aside class="k-side">
    <div class="goal" id="goal">
      <span class="goal-label">Next goal</span>
      <span class="goal-tiles"><span class="mini" id="goal-have"></span><span class="goal-arrow" data-k-icon="next"></span><span class="mini" id="goal-next"></span></span>
    </div>
    <div class="side-btns">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
    <div class="hint k-only-landscape">Swipe to slide every tile. Two of the same add up!</div>
  </aside>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
