<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="scores">
    <div class="score" id="score">0</div>
    <div class="best">Best <span id="best">0</span></div>
  </div>
  <button id="restart-btn" class="icon-btn" aria-label="New game">⟳</button>
</header>

<div class="board-wrap">
  <div id="board" class="board">
    <div id="tiles" class="tiles"></div>
  </div>
  <div id="gain" class="gain"></div>
</div>

<div class="hint">Swipe to slide the tiles. Same numbers add up.</div>

<div id="won" class="over hidden">
  <div class="over-card">
    <div class="over-emoji">🏆</div>
    <h2>You made 2048!</h2>
    <div class="over-actions">
      <button id="won-new" class="pill">New game</button>
      <button id="won-go" class="pill primary">Keep going</button>
    </div>
  </div>
</div>

<div id="over" class="over hidden">
  <div class="over-card">
    <h2>No moves left</h2>
    <div class="over-score"><span id="over-score">0</span></div>
    <div class="over-best">Best <span id="over-best">0</span></div>
    <button id="over-again" class="pill primary">Play again</button>
  </div>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
