<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Block Blast</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="scores">
    <div class="score" id="score">0</div>
    <div class="best">Best <span id="best">0</span></div>
  </div>
  <button id="restart-btn" class="icon-btn" aria-label="New game">⟳</button>
</header>

<div class="board-wrap">
  <div id="board" class="board"></div>
  <div id="combo" class="combo"></div>
</div>

<div id="tray" class="tray"></div>

<div id="over" class="over hidden">
  <div class="over-card">
    <h2>No room left</h2>
    <div class="over-score"><span id="over-score">0</span></div>
    <div class="over-best">Best <span id="over-best">0</span></div>
    <button id="over-again" class="pill primary">Play again</button>
  </div>
</div>

<script src="js/pieces.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
