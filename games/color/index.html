<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Color by Number</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- the picture library -->
<section id="library" class="k-shell screen">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid"><div class="k-title">Color by Number</div></div>
    <div class="k-bar__end">
      <button id="photo-btn" class="k-btn k-btn--primary photo-btn" aria-label="Make one from a photo"><span class="ico" data-ico="camera"></span><span class="lbl">Photo</span></button>
    </div>
  </header>
  <nav id="lib-tabs" class="lib-tabs" aria-label="Sections"></nav>
  <div id="lib-grid" class="lib-grid"></div>
  <input type="file" id="photo-input" accept="image/*" hidden>
</section>

<!-- colouring a picture -->
<section id="game" class="k-shell k-shell--side screen k-hidden">
  <header class="k-bar">
    <div class="k-bar__start">
      <button id="back-btn" class="k-btn k-btn--icon" data-k-icon="back" aria-label="Back to the pictures"></button>
    </div>
    <div class="k-bar__mid">
      <div class="progress" id="progress" aria-label="Progress">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <b id="progress-pct">0%</b>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="undo-btn" class="k-btn k-btn--icon" data-k-icon="undo" aria-label="Undo" disabled></button>
      <button id="hint-btn" class="k-btn k-btn--icon" data-k-icon="hint" aria-label="Find one to colour"></button>
    </div>
  </header>
  <main id="stage" class="k-stage paint-stage"><canvas id="canvas"></canvas></main>
  <aside class="k-side paint-side">
    <div id="palette" class="palette" role="group" aria-label="Colours"></div>
    <div class="tools">
      <button id="zoom-out" class="k-btn k-btn--icon k-btn--sm" aria-label="Zoom out"><span class="ico" data-ico="zoomout"></span></button>
      <button id="zoom-fit" class="k-btn k-btn--icon k-btn--sm" aria-label="Show the whole picture"><span class="ico" data-ico="fit"></span></button>
      <button id="zoom-in" class="k-btn k-btn--icon k-btn--sm" aria-label="Zoom in"><span class="ico" data-ico="zoomin"></span></button>
      <button id="help-btn" class="k-btn k-btn--icon k-btn--sm" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon k-btn--sm" aria-label="Sound"></button>
    </div>
  </aside>
</section>

<script src="../../kit/kit.js"></script>
<script src="js/util.js"></script>
<script src="js/quantize.js"></script>
<script src="js/puzzles-data.js"></script>
<script src="js/pictures-medium.js"></script>
<script src="js/pictures-hard.js"></script>
<script src="js/pictures-expert.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
