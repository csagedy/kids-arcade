<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>Four in a Row</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="scores">
    <div class="score" id="status">Your turn</div>
    <div class="best" id="sub">Wins <span id="wins">0</span></div>
  </div>
  <button id="menu-btn" class="icon-btn" aria-label="New game">⟳</button>
</header>

<div class="board-wrap">
  <div id="board" class="board"></div>
</div>

<div class="hint" id="hint">Tap a column to drop a disc. Get four in a row!</div>

<div id="setup" class="over hidden">
  <div class="over-card">
    <h2>Four in a Row</h2>
    <div class="menu">
      <button class="pill" data-mode="easy">🙂 Easy</button>
      <button class="pill" data-mode="medium">😎 Medium</button>
      <button class="pill" data-mode="hard">🤖 Hard</button>
      <button class="pill" data-mode="two">👫 Two players</button>
    </div>
    <button id="setup-cancel" class="link hidden">Keep playing</button>
  </div>
</div>

<div id="over" class="over hidden">
  <div class="over-card">
    <div class="over-emoji" id="over-emoji">🎉</div>
    <h2 id="over-title">You win!</h2>
    <div class="over-actions">
      <button id="over-menu" class="pill">Change game</button>
      <button id="over-again" class="pill primary">Play again</button>
    </div>
  </div>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
