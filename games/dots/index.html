<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Dot to Dot</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- picture library -->
<div id="lib" class="k-shell">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-title">Dot to Dot</div>
      <div class="k-stat k-stat--accent"><span class="k-stat__label">Done</span><b class="k-stat__val" id="lib-done">0</b></div>
    </div>
    <div class="k-bar__end">
      <button id="lib-help" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="lib-mute" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
  </header>
  <div class="lib-scroll" id="lib-scroll"><div id="lib-grid"></div></div>
</div>

<!-- one picture -->
<div id="play" class="k-shell k-shell--side" hidden>
  <header class="k-bar">
    <div class="k-bar__start">
      <button id="back-btn" class="k-btn k-btn--icon" data-k-icon="menu" aria-label="All pictures"></button>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="next-chip"><span class="k-stat__label">Next</span><b class="k-stat__val" id="next-n">1</b></div>
        <div class="k-stat"><span class="k-stat__label">Dots</span><b class="k-stat__val" id="progress">0/0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="clear-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="Start over"></button>
    </div>
  </header>

  <main class="k-stage">
    <div id="board" class="board k-fit" style="--k-aspect: 1"><canvas id="canvas"></canvas></div>
  </main>

  <aside class="k-side">
    <div class="pic-card">
      <div class="pic-name" id="title"></div>
      <div class="pic-bar"><i id="pic-bar"></i></div>
    </div>
    <div class="side-btns">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
    <div class="hint k-only-landscape">Tap the dots in number order, or slide your finger from dot to dot.</div>
  </aside>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/pictures-data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
