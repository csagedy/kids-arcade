<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>Dot to Dot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="lib" class="screen">
  <header class="head">
    <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
    <div class="ttl">Dot to Dot</div>
    <div class="icon-spacer"></div>
  </header>
  <p class="how">Tap the dots in number order to draw the picture.</p>
  <div id="lib-grid" class="lib-grid"></div>
</section>

<section id="play" class="screen hidden">
  <header class="head">
    <button id="back-btn" class="icon-btn" aria-label="Back">‹</button>
    <div class="ttl" id="title"></div>
    <button id="clear-btn" class="icon-btn" aria-label="Start over">⟳</button>
  </header>
  <div class="stats" id="progress">0 / 0</div>
  <main class="board-wrap"><canvas id="board"></canvas></main>
</section>

<div id="win" class="over hidden">
  <div class="over-card">
    <div class="over-emoji">✨</div>
    <h2><span id="win-name"></span>!</h2>
    <div class="over-actions">
      <button id="win-lib" class="pill">All pictures</button>
      <button id="win-next" class="pill primary">Next</button>
    </div>
  </div>
</div>

<script src="js/pictures-data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
