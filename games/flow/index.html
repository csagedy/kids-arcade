<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Flow</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-noswipe">

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent"><span class="k-stat__label">Level</span><b class="k-stat__val" id="level-n">1</b></div>
        <div class="k-stat" id="flows-chip"><span class="k-stat__label">Joined</span><b class="k-stat__val" id="flows">0/0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="hint-btn" class="k-btn k-btn--icon" data-k-icon="hint" aria-label="Hint"></button>
      <button id="restart-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="Clear the board"></button>
    </div>
  </header>

  <main class="k-stage">
    <div id="board" class="board k-fit" style="--k-aspect: 1"><canvas id="canvas"></canvas></div>
  </main>

  <aside class="k-side">
    <div class="fill-card">
      <div class="fill-top"><span class="k-label">Board filled</span><b id="fill">0%</b></div>
      <div class="fill-bar"><i id="fill-bar"></i></div>
    </div>
    <div class="side-row">
      <button id="prev-btn" class="k-btn k-btn--icon" data-k-icon="back" aria-label="Previous level"></button>
      <button id="levels-btn" class="k-btn levels-btn"><span data-k-icon="menu"></span><span class="lv-txt">Levels</span></button>
      <button id="next-btn" class="k-btn k-btn--icon flip" data-k-icon="back" aria-label="Next level"></button>
    </div>
    <div class="side-row">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
    <div class="hint k-only-landscape">Drag from a dot to its twin. Pipes can't cross. Fill every square for three stars!</div>
  </aside>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
