<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Go Fish</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="../../cards/cards.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="k-shell">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="sets-chip"><span class="k-stat__label">My sets</span><b class="k-stat__val" id="sets">0</b></div>
        <div class="k-stat" id="pond-chip"><span class="k-stat__label">Pond</span><b class="k-stat__val" id="pond-n">0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
      <button id="menu-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="New game"></button>
    </div>
  </header>

  <main class="k-stage gf-stage">
    <div class="cd-table table" id="table">
      <div class="seats" id="seats"></div>

      <div class="middle">
        <button class="pond" id="pond" type="button" aria-label="The pond: tap to fish">
          <span class="pond-water"></span>
          <span class="pond-cards" id="pond-cards"></span>
          <span class="pond-fish" aria-hidden="true">🐟</span>
          <span class="pond-rod" aria-hidden="true">🎣</span>
        </button>
        <div class="shelf" id="shelf" aria-label="My sets"></div>
      </div>

      <div class="mine">
        <div class="hint" id="hint" aria-live="polite"></div>
        <div class="hand" id="hand"></div>
      </div>
    </div>
  </main>
</div>

<div id="setup" class="k-overlay gf-setup hidden" role="dialog" aria-modal="true">
  <div class="k-card">
    <div class="setup-art" aria-hidden="true"></div>
    <h2>Go Fish</h2>
    <p>Who do you want to play with?</p>
    <div class="start-grid">
      <button class="k-btn k-btn--good start" data-players="1" aria-label="1 friend"><span class="faces">🐻</span><span class="dots"><i></i></span></button>
      <button class="k-btn k-btn--blue start" data-players="2" aria-label="2 friends"><span class="faces">🐻🦊</span><span class="dots"><i></i><i></i></span></button>
      <button class="k-btn k-btn--purple start" data-players="3" aria-label="3 friends"><span class="faces">🐻🦊🐰</span><span class="dots"><i></i><i></i><i></i></span></button>
    </div>
    <div class="setup-foot">
      <button id="help-btn" class="k-btn k-btn--ghost k-btn--sm" type="button"><span data-k-icon="help"></span>How to play</button>
      <button id="setup-cancel" class="k-btn k-btn--sm hidden" type="button" aria-label="Keep playing"><span data-k-icon="play"></span>Keep playing</button>
    </div>
  </div>
</div>

<script src="../../kit/kit.js"></script>
<script src="../../cards/cards.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
