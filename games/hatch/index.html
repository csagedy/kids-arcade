<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Hatch Match</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="../../cards/cards.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="k-shell hm-shell">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="wins-chip"><span class="k-stat__label">Wins</span><b class="k-stat__val" id="wins">0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
      <button id="new-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="New game"></button>
    </div>
  </header>

  <main class="k-stage hm-stage">
    <div class="cd-table hm-table" id="table">
      <div class="hm-seats" id="seats"></div>
      <div class="hm-mid">
        <div class="hm-piles">
          <div class="hm-pilebox">
            <div id="deck" class="hm-pile hm-deck" role="button" aria-label="Draw a card"></div>
            <span class="hm-deckn" id="deck-n"></span>
          </div>
          <div class="hm-pilebox">
            <div id="pile" class="hm-pile hm-discard" aria-label="Top card"></div>
            <div id="munch" class="hm-munch" aria-hidden="true"></div>
          </div>
        </div>
      </div>
      <div class="hm-mine" id="mine">
        <div class="hm-row">
          <div class="hm-status" id="status" role="status"></div>
          <button id="done-btn" class="k-btn k-btn--good hm-act k-hidden" data-k-icon="check"><span>Done</span></button>
          <button id="keep-btn" class="k-btn hm-act k-hidden" data-k-icon="check"><span>Keep it</span></button>
        </div>
        <div class="hm-hand" id="hand"></div>
      </div>
    </div>
  </main>
</div>

<script src="../../kit/kit.js"></script>
<script src="../../cards/cards.js"></script>
<script src="js/game.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
