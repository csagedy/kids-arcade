<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Solitaire</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="../../cards/cards.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-noswipe">

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="moves-chip"><span class="k-stat__label">Moves</span><b class="k-stat__val" id="moves">0</b></div>
        <div class="k-stat" id="time-chip"><span class="k-stat__label">Time</span><b class="k-stat__val" id="time">0:00</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="new-btn" class="k-btn k-btn--icon" data-k-icon="new" aria-label="New deal"></button>
    </div>
  </header>

  <main class="k-stage kl-stage">
    <div class="cd-table cd-two-color cd-peek kl-felt">
      <div id="board" class="kl-board" aria-label="Solitaire table"></div>
    </div>
  </main>

  <aside class="k-side kl-side">
    <div class="kl-mode k-only-landscape">
      <span class="k-label">Playing</span>
      <b id="mode-name">Draw 1</b>
      <span class="kl-wins" id="wins-line"></span>
    </div>
    <div class="kl-main-btns">
      <button id="undo-btn" class="k-btn kl-wide" aria-label="Undo" disabled><span data-k-icon="undo"></span><span>Undo</span></button>
      <button id="hint-btn" class="k-btn k-btn--primary kl-wide" aria-label="Hint"><span data-k-icon="hint"></span><span>Hint</span></button>
    </div>
    <div class="kl-small-btns">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
  </aside>
</div>

<canvas id="cascade" class="kl-cascade" aria-hidden="true"></canvas>

<script src="../../kit/kit.js"></script>
<script src="../../cards/cards.js"></script>
<script src="js/rules.js"></script>
<script src="js/deals.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
