<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Maze</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-noswipe">

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="level-chip"><span class="k-stat__label">Level</span><b class="k-stat__val" id="level">1</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="levels-btn" class="k-btn k-btn--icon" data-k-icon="menu" aria-label="Pick a maze"></button>
      <button id="restart-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="Start this maze over"></button>
    </div>
  </header>

  <main class="k-stage">
    <div id="board" class="board k-fit" style="--k-aspect: 1">
      <canvas id="maze"></canvas>
    </div>
  </main>

  <aside class="k-side">
    <div class="goal" id="goal">
      <span class="goal-pic" id="goal-who">🐭</span>
      <span class="goal-arrow" data-k-icon="next"></span>
      <span class="goal-pic" id="goal-what">🧀</span>
      <span class="goal-text" id="goal-text">Help the mouse find the cheese!</span>
    </div>
    <div class="side-btns">
      <button id="hint-btn" class="k-btn k-btn--primary hint-btn" aria-label="Show the way"><span data-k-icon="hint"></span><span class="k-only-landscape">Hint</span></button>
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
  </aside>
  <footer class="k-foot k-only-portrait" id="hint">Drag the animal to the treat. Slide back to undo.</footer>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
