<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>Maze</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="scores"><div class="score" id="level">Level 1</div></div>
  <button id="restart-btn" class="icon-btn" aria-label="Start over">⟳</button>
</header>

<div class="board-wrap">
  <div class="board"><canvas id="maze"></canvas></div>
</div>

<div class="hint" id="hint">Drag from the animal to the treat. Slide back to undo.</div>

<div id="confetti" class="confetti"></div>
<div id="win" class="over hidden">
  <div class="over-card">
    <div class="over-emoji" id="win-emoji">🎉</div>
    <h2>You did it!</h2>
    <button id="win-next" class="pill primary">Next maze</button>
  </div>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
