<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Memory Match</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="pairs-chip"><span class="k-stat__label">Pairs</span><b class="k-stat__val" id="pairs">0/6</b></div>
        <div class="k-stat" id="moves-chip"><span class="k-stat__label">Moves</span><b class="k-stat__val" id="moves">0</b></div>
      </div>
      <div class="peek-msg" id="peek-msg" role="status" hidden><span aria-hidden="true">👀</span> Remember them!</div>
    </div>
    <div class="k-bar__end">
      <button id="restart-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="New game"></button>
    </div>
  </header>

  <main class="k-stage" id="stage">
    <div id="board" class="board k-fit" style="--k-aspect: 0.75"></div>
  </main>

  <aside class="k-side">
    <div class="k-seg sizes" role="group" aria-label="Board size">
      <button class="size-btn" data-size="easy">Easy</button>
      <button class="size-btn" data-size="medium">Medium</button>
      <button class="size-btn" data-size="hard">Hard</button>
    </div>
    <div class="themes" id="themes" role="group" aria-label="Pictures"></div>
    <div class="side-foot">
      <div class="best" id="best"></div>
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
  </aside>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
