<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>Memory Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="scores">
    <div class="score"><span id="moves">0</span> <small>moves</small></div>
    <div class="best" id="best"></div>
  </div>
  <button id="restart-btn" class="icon-btn" aria-label="New game">⟳</button>
</header>

<div class="sizes">
  <button class="size-btn" data-size="easy">Easy</button>
  <button class="size-btn" data-size="medium">Medium</button>
  <button class="size-btn" data-size="hard">Hard</button>
</div>

<main class="board-wrap"><div id="board" class="board"></div></main>

<div id="win" class="over hidden">
  <div class="over-card">
    <div class="over-emoji">🎉</div>
    <h2>All matched!</h2>
    <div class="over-score"><span id="win-moves">0</span> <small>moves</small></div>
    <div id="win-best" class="over-best hidden">New best!</div>
    <button id="win-again" class="pill primary">Play again</button>
  </div>
</div>

<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
