<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Mini Golf</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="k-noswipe">

<div class="k-shell golf">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="turn k-only-landscape" aria-live="polite"><i class="turn__ball"></i><span class="turn__name"></span><span class="turn__stars"></span></div>
      <div class="k-stats">
        <div class="k-stat" id="hole-chip"><span class="k-stat__label">Hole</span><b class="k-stat__val" id="hole">1</b></div>
        <div class="k-stat" id="par-chip"><span class="k-stat__label">Par</span><b class="k-stat__val" id="par">2</b></div>
        <div class="k-stat k-stat--accent" id="shots-chip"><span class="k-stat__label">Shots</span><b class="k-stat__val" id="shots">0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="help-btn2" class="k-btn k-btn--icon k-only-landscape" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn2" class="k-btn k-btn--icon k-only-landscape" aria-label="Sound"></button>
      <button id="card-btn" class="k-btn k-btn--icon" data-k-icon="trophy" aria-label="Scorecard"></button>
      <button id="menu-btn" class="k-btn k-btn--icon" data-k-icon="menu" aria-label="Pick a course"></button>
    </div>
  </header>

  <main class="k-stage golf-stage">
    <div id="course" class="course" aria-label="Mini golf hole. Pull back anywhere and let go to putt.">
      <canvas id="cv"></canvas>
      <div id="banner" class="banner" aria-live="polite"></div>
    </div>
  </main>

  <div class="golf-foot k-only-portrait">
    <div class="turn"><i class="turn__ball"></i><span class="turn__name"></span><span class="turn__stars"></span></div>
    <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
    <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
  </div>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/sim.js"></script>
<script src="js/holes.js"></script>
<script src="js/draw.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
