<!doctype html>
<html lang="en" class="k-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#161843">
<title>Water Sort</title>
<link rel="stylesheet" href="../../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="k-shell k-shell--side">
  <header class="k-bar">
    <div class="k-bar__start">
      <a class="k-btn k-btn--icon" href="../../index.html" data-k-icon="back" aria-label="Back to the arcade"></a>
    </div>
    <div class="k-bar__mid">
      <div class="k-stats">
        <div class="k-stat k-stat--accent" id="level-chip"><span class="k-stat__label">Level</span><b class="k-stat__val" id="level-n">1</b></div>
        <div class="k-stat" id="moves-chip"><span class="k-stat__label">Moves</span><b class="k-stat__val" id="moves">0</b></div>
      </div>
    </div>
    <div class="k-bar__end">
      <button id="undo-btn" class="k-btn k-btn--icon" data-k-icon="undo" aria-label="Undo" disabled></button>
      <button id="restart-btn" class="k-btn k-btn--icon" data-k-icon="restart" aria-label="Start this level over"></button>
    </div>
  </header>

  <main class="k-stage" id="stage">
    <div id="board" class="board"></div>
    <div id="stuck" class="stuck k-hidden" role="status">
      <span id="stuck-text">No moves left</span>
      <button id="stuck-undo" class="k-btn k-btn--primary k-btn--sm"><span data-k-icon="undo"></span><span>Undo</span></button>
    </div>
  </main>

  <aside class="k-side">
    <button id="hint-btn" class="k-btn k-btn--primary side-big" aria-label="Hint"><span data-k-icon="hint"></span><span class="lbl">Hint</span></button>
    <button id="tube-btn" class="k-btn k-btn--blue side-big" aria-label="Add an empty tube"><span data-k-icon="new"></span><span class="lbl">Tube</span></button>
    <div class="side-small">
      <button id="help-btn" class="k-btn k-btn--icon" data-k-icon="help" aria-label="How to play"></button>
      <button id="mute-btn" class="k-btn k-btn--icon" aria-label="Sound"></button>
    </div>
  </aside>
</div>

<script src="../../kit/kit.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>Kit.registerSW('../../sw.js');</script>
</body>
</html>
