<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#14161c">
<title>Water Sort</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="head">
  <a class="icon-btn" href="../../index.html" aria-label="Back">‹</a>
  <div class="level">Level <span id="level-n">1</span></div>
  <button id="hint-btn" class="icon-btn" aria-label="Hint">💡</button>
  <button id="undo-btn" class="icon-btn" aria-label="Undo">↺</button>
  <button id="mute-btn" class="icon-btn" aria-label="Sound on">🔊</button>
  <button id="restart-btn" class="icon-btn" aria-label="Restart">⟳</button>
</header>

<main id="board" class="board"></main>
<div id="tip" class="tip hidden">Tap a tube, then tap another tube to pour. Fill each tube with one colour!</div>
<div id="stuck" class="stuck hidden"><span id="stuck-text">No moves left</span> <button id="stuck-undo" class="pill small">↺ Undo</button></div>
<canvas id="confetti" class="confetti"></canvas>

<div id="win" class="win hidden">
  <div class="win-card">
    <div class="win-emoji">🎉</div>
    <h2>Level <span id="win-n">1</span> done!</h2>
    <div class="win-actions">
      <button id="win-replay" class="pill">Again</button>
      <button id="win-next" class="pill primary">Next level</button>
    </div>
  </div>
</div>

<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
