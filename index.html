<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arcade</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(120% 70% at 50% 0%, #1d2233 0%, #14161c 65%);
    color: #f2f4f8;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: #97a0b3; font-size: 14px; margin-bottom: 22px; }
  .wrap { padding: calc(env(safe-area-inset-top) + 26px) 20px calc(env(safe-area-inset-bottom) + 30px); max-width: 620px; margin: 0 auto; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .game {
    display: block; text-decoration: none; color: inherit;
    background: #1e222b; border-radius: 18px; overflow: hidden;
  }
  .game:active { transform: scale(0.97); }
  .art { height: 108px; display: flex; align-items: center; justify-content: center; font-size: 44px; }
  .name { padding: 12px 14px 15px; font-weight: 600; }
  .art.color { background: linear-gradient(135deg, #e8792b, #f06ca8); }
  .art.water { background: linear-gradient(135deg, #4fa3f7, #3fb950); }
  .art.blocks { background: linear-gradient(135deg, #a06cf0, #4fa3f7); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arcade</h1>
  <div class="sub">No ads. No timers. Just games.</div>
  <div class="games">
    <a class="game" href="games/color/index.html">
      <div class="art color">🎨</div>
      <div class="name">Color by Number</div>
    </a>
    <a class="game" href="games/watersort/index.html">
      <div class="art water">🧪</div>
      <div class="name">Water Sort</div>
    </a>
    <a class="game" href="games/blockblast/index.html">
      <div class="art blocks">🧱</div>
      <div class="name">Block Blast</div>
    </a>
  </div>
</div>
</body>
</html>
