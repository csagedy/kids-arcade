<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-arcade.png">
<link rel="icon" href="icon-arcade.png">
<meta name="theme-color" content="#161843">
<title>Arcade</title>
<link rel="stylesheet" href="kit/kit.css">
<style>
  /* The menu scrolls (it's the one page that does); tiles never animate
     their opacity, so nothing can be left invisible if an animation stalls. */
  html, body { min-height: 100%; overscroll-behavior-y: none; }
  .wrap {
    max-width: 1200px; margin: 0 auto;
    padding: calc(var(--k-safe-t) + 18px) calc(var(--k-safe-r) + var(--k-gutter)) calc(var(--k-safe-b) + 28px) calc(var(--k-safe-l) + var(--k-gutter));
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 12px; }
  .logo { flex: 1; margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 0.01em; line-height: 1; display: flex; }
  .logo span { display: inline-block; text-shadow: 0 4px 0 rgba(8, 9, 32, 0.6); }
  .logo span:nth-child(odd) { transform: rotate(-4deg); }
  .logo span:nth-child(even) { transform: translateY(2px) rotate(3deg); }
  .tagline { color: var(--k-muted); font-weight: 600; font-size: var(--k-fs-sm); margin: 6px 0 18px; }
  .pill-status {
    display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: var(--k-r-round);
    font-size: 13px; font-weight: 800; color: var(--k-muted); background: var(--k-surface-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 3px 0 var(--k-edge);
  }
  .pill-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k-faint); }
  .pill-status.ok { color: var(--k-good); }
  .pill-status.ok .dot { background: var(--k-good); box-shadow: 0 0 8px var(--k-good); }
  .pill-status.partial { color: var(--k-accent); }
  .pill-status.partial .dot { background: var(--k-accent); }

  /* ---------- resume card ---------- */
  .resume {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    padding: 10px 12px 10px 10px; margin-bottom: 26px; border-radius: var(--k-r-lg);
    background: linear-gradient(100deg, #3a3f97, var(--k-surface-1) 70%);
    box-shadow: inset 0 0 0 2px rgba(255, 210, 63, 0.55), 0 6px 0 var(--k-edge), var(--k-shadow-2);
    transition: transform 70ms ease-out, box-shadow 70ms ease-out;
  }
  .resume:active { transform: translateY(5px); box-shadow: inset 0 0 0 2px rgba(255, 210, 63, 0.55), 0 1px 0 var(--k-edge); }
  .r-art { flex: none; width: 76px; height: 57px; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .r-art svg { width: 100%; height: 100%; display: block; }
  .r-art.cab { background: #05060f; padding: 4px; }
  .r-art.card { background: radial-gradient(120% 140% at 50% 0%, #1f6b47, #0f3d29); padding: 4px 0; }
  .r-art.card svg { width: auto; background: #fffdf7; border-radius: 5px; }
  .r-text { flex: 1; min-width: 0; }
  .r-top { font-size: 12px; font-weight: 900; letter-spacing: 0.12em; color: var(--k-accent); }
  .r-name { font-weight: 900; font-size: var(--k-fs-lg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-go {
    flex: none; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--k-accent); color: var(--k-accent-ink); font-size: 26px; box-shadow: 0 4px 0 var(--k-accent-edge);
  }
  .r-go .k-icon { margin-left: 3px; }

  /* ---------- sections ---------- */
  .sec { margin-top: 30px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 14px; }
  .sec-title { margin: 0; font-size: var(--k-fs-xl); font-weight: 900; letter-spacing: -0.01em; }
  .sec-sub { color: var(--k-muted); font-size: var(--k-fs-sm); font-weight: 600; }

  /* puzzles: candy tiles */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 760px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .tile {
    position: relative; display: block; text-decoration: none; color: inherit;
    padding: 8px 8px 0; border-radius: var(--k-r-lg); background: var(--k-surface-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 0 var(--k-edge), 0 12px 22px rgba(5,6,30,0.35);
    margin-bottom: 6px;
    transition: transform 70ms ease-out, box-shadow 70ms ease-out;
    animation: tile-in 0.45s var(--k-ease-pop) backwards; animation-delay: calc(var(--i, 0) * 30ms);
  }
  .tile:active { transform: translateY(6px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 var(--k-edge), 0 4px 8px rgba(5,6,30,0.3); }
  @keyframes tile-in { from { transform: translateY(14px) scale(0.96); } }
  .tile-art {
    position: relative; aspect-ratio: 4 / 3; border-radius: calc(var(--k-r-lg) - 6px); overflow: hidden;
    background: linear-gradient(140deg, var(--c1), var(--c2));
    display: flex; align-items: center; justify-content: center; font-size: 48px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12), inset 0 2px 0 rgba(255,255,255,0.25);
  }
  .tile-art svg { width: 100%; height: 100%; display: block; transition: transform 0.15s var(--k-ease-pop); }
  .tile:active .tile-art svg { transform: scale(1.06) rotate(-2deg); }
  svg text { font-family: var(--k-font); font-weight: 900; }
  .tile-meta { padding: 10px 6px 12px; }
  .tile-name { font-weight: 900; font-size: 17px; line-height: 1.15; letter-spacing: -0.01em; }
  .tile-stat { font-size: 13px; color: var(--k-faint); font-weight: 700; margin-top: 2px; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-stat.has { color: var(--k-accent); }
  .badge-new {
    position: absolute; top: 2px; right: 2px; z-index: 2; padding: 5px 9px; border-radius: var(--k-r-round);
    background: var(--k-accent); color: var(--k-accent-ink); font-size: 11px; font-weight: 900; letter-spacing: 0.06em;
    box-shadow: 0 3px 0 var(--k-accent-edge); transform: rotate(6deg);
  }
  @media (min-width: 760px) {
    .tile-name { font-size: 18px; }
    .tile-stat { font-size: 14.5px; }
    .tile-meta { padding: 12px 8px 14px; }
  }

  /* action: a row of little arcade cabinets */
  .marquee {
    font-family: "Courier New", Courier, ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: 0.2em;
    color: #7cf2ff; text-shadow: 0 0 10px rgba(124,242,255,0.7), 0 0 22px rgba(255,46,126,0.45); font-size: 24px;
  }
  .arcade-floor {
    border-radius: var(--k-r-lg); padding: 18px 14px 6px;
    background:
      linear-gradient(180deg, rgba(255,46,126,0.08), transparent 40%),
      repeating-linear-gradient(90deg, rgba(124,242,255,0.05) 0 2px, transparent 2px 40px),
      #0d0e27;
    box-shadow: inset 0 0 0 2px rgba(124,242,255,0.12), inset 0 -30px 40px rgba(167,123,255,0.08);
  }
  .cab-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .cab {
    flex: 0 0 calc((100% - 2 * 14px) / 3); min-width: 0;
    display: block; text-decoration: none; color: inherit; margin-bottom: 12px;
    background: linear-gradient(180deg, #2c2f45, #1a1c2b); border-radius: 14px 14px 8px 8px;
    padding: 0 7px 9px; position: relative;
    box-shadow: 0 6px 0 #090a16, 0 12px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 70ms ease-out, box-shadow 70ms ease-out;
  }
  .cab:active { transform: translateY(6px); box-shadow: 0 0 0 #090a16, 0 4px 8px rgba(0,0,0,0.5); }
  @media (max-width: 559px) {
    .cab-top { white-space: normal; letter-spacing: 0.04em; line-height: 1.15; min-height: 3em; display: flex; align-items: center; justify-content: center; }
  }
  @media (min-width: 560px) { .cab-row { gap: 16px; } .cab { flex-basis: calc((100% - 3 * 16px) / 4); } }
  @media (min-width: 1100px) { .cab { flex-basis: calc((100% - 6 * 16px) / 7); } }
  .cab-top {
    margin: 0 -7px 7px; padding: 6px 4px 5px; border-radius: 14px 14px 4px 4px; text-align: center;
    background: linear-gradient(180deg, #ff2e7e, #a23cff);
    font-family: "Courier New", Courier, ui-monospace, Menlo, monospace; font-weight: 700; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cab-screen {
    aspect-ratio: 4 / 3; border-radius: 8px; background: #05060f; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    box-shadow: inset 0 0 0 3px #0b0c16, 0 0 0 2px #3a3d55;
  }
  .cab-screen svg { width: 100%; height: 100%; display: block; }
  .cab-screen::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0 1px, transparent 1px 3px),
                radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.6) 100%);
  }
  .cab-deck { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 7px; height: 12px; }
  .cab-deck i { width: 9px; height: 9px; border-radius: 50%; background: #ff4d6d; box-shadow: 0 2px 0 #8a1d33; }
  .cab-deck i:nth-child(2) { background: #ffd23f; box-shadow: 0 2px 0 #9a6f00; }
  .cab-deck b { width: 4px; height: 12px; border-radius: 2px; background: #9aa0c0; margin-right: 6px; position: relative; }
  .cab-deck b::before { content: ''; position: absolute; top: -4px; left: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ff2e7e; }
  .cab-stat { font-family: "Courier New", Courier, monospace; font-weight: 700; font-size: 12px; color: #7cf2ff; text-align: center; margin-top: 6px; min-height: 15px; letter-spacing: 0.06em; text-shadow: 0 0 6px rgba(124,242,255,0.5); }
  @media (min-width: 760px) { .cab-top { font-size: 13px; padding: 8px 4px 7px; } .cab-stat { font-size: 13.5px; } }

  /* cards: a strip of felt with a dealt card per game */
  .felt-title { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-style: italic; }
  .felt {
    display: flex; flex-wrap: wrap; gap: 22px; padding: 22px 20px 18px; border-radius: var(--k-r-lg);
    background: radial-gradient(120% 140% at 50% 0%, #217451, #0f3d29);
    box-shadow: inset 0 0 0 3px #6b4423, inset 0 0 0 6px #8a5a2f, inset 0 10px 24px rgba(0,0,0,0.35), 0 6px 0 #082116;
  }
  .ctile { display: block; width: 104px; text-decoration: none; color: inherit; text-align: center; transition: transform 0.12s; }
  .ctile:active { transform: scale(0.94) rotate(-2deg); }
  .ctile-card {
    position: relative; margin: 0 auto; width: 84px; aspect-ratio: 5 / 7; border-radius: 10px; background: #fffdf7;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 10px 18px rgba(0,0,0,0.35); transform: rotate(-4deg);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
  }
  .ctile-stack { position: relative; width: 84px; margin: 0 auto; }
  .ctile-back {
    position: absolute; inset: 0; border-radius: 10px; transform: rotate(7deg) translate(9px, 2px);
    background: repeating-linear-gradient(45deg, #7a4be0 0 6px, #5f35bf 6px 12px); box-shadow: inset 0 0 0 4px #fffdf7, 0 6px 12px rgba(0,0,0,0.3);
  }
  .ctile-card svg { width: 100%; height: 100%; display: block; }
  .ctile-corner { position: absolute; top: 5px; left: 7px; font-weight: 900; font-size: 16px; color: var(--corner, #e5484d); line-height: 1; }
  .ctile-name { margin-top: 12px; font-weight: 900; font-size: 15px; color: #fffdf7; }
  .ctile-stat { font-size: 12.5px; color: #ffd23f; font-weight: 700; min-height: 17px; }
  @media (min-width: 760px) {
    .ctile { width: 130px; }
    .ctile-card, .ctile-stack { width: 104px; }
    .ctile-corner { font-size: 19px; }
    .ctile-name { font-size: 17px; }
  }

  /* ---------- footer ---------- */
  .foot { margin-top: 36px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .foot .k-btn { flex: none; }
  .version { text-align: center; color: var(--k-faint); font-size: 12px; font-weight: 700; margin-top: 8px; }

  /* backup sheet */
  #sheet .k-card { text-align: left; }
  #sheet h2 { font-size: var(--k-fs-lg); }
  #sheet p { margin: 0 0 14px; font-size: var(--k-fs-sm); }
  #sheet .k-row { margin: 0 0 6px; }
  textarea {
    width: 100%; height: 92px; resize: none; border: none; border-radius: var(--k-r);
    background: var(--k-bg-deep); color: var(--k-text); font: 12px/1.4 ui-monospace, Menlo, monospace;
    padding: 12px; margin-bottom: 8px; -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  .msg { font-size: 13px; font-weight: 700; color: var(--k-muted); min-height: 18px; margin-top: 4px; text-align: center; }
  .msg.ok { color: var(--k-good); }
  .msg.bad { color: var(--k-bad); }
  .hidden { display: none !important; }

  @media (min-width: 760px) {
    .logo { font-size: 56px; }
    .tagline { font-size: 16px; }
    .resume { padding: 12px 16px 12px 12px; }
    .r-art { width: 104px; height: 78px; }
    .r-name { font-size: 26px; }
    .r-go { width: 62px; height: 62px; font-size: 30px; }
    .sec { margin-top: 38px; }
  }
  @media (min-width: 1100px) { .tile-name { font-size: 16.5px; } }
  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none; }
    .tile, .cab, .resume, .ctile, .tile-art svg { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo" aria-label="Arcade"><span style="color:#ff5d73">A</span><span style="color:#ff9f43">r</span><span style="color:#ffd23f">c</span><span style="color:#3ddc84">a</span><span style="color:#4cc2ff">d</span><span style="color:#a77bff">e</span></h1>
    <div id="offline" class="pill-status"><span class="dot"></span><span id="offline-text">Checking…</span></div>
  </header>
  <div class="tagline">No ads. No accounts. Just games.</div>

  <div id="resume-slot"></div>

  <section class="sec" id="puzzles">
    <div class="sec-head"><h2 class="sec-title">Puzzles</h2><span class="sec-sub">no timers, take your time</span></div>
    <div class="grid" id="games"></div>
  </section>

  <section class="sec" id="action">
    <div class="sec-head"><h2 class="marquee">ACTION</h2><span class="sec-sub">timers, lives, high scores</span></div>
    <div class="arcade-floor"><div class="cab-row" id="cabinet"></div></div>
  </section>

  <section class="sec" id="cards-section">
    <div class="sec-head"><h2 class="sec-title felt-title">Cards</h2><span class="sec-sub">against the computer, or pass the iPad</span></div>
    <div class="felt" id="card-games"></div>
  </section>

  <div class="foot">
    <button id="backup-btn" class="k-btn k-btn--sm">Backup &amp; restore progress</button>
    <button id="update-btn" class="k-btn k-btn--sm">Update now</button>
  </div>
  <div class="version" id="version"></div>
</div>

<div id="sheet" class="k-overlay k-overlay--sheet hidden">
  <div class="k-card">
    <h2>Backup &amp; restore</h2>
    <p>Progress lives on this device. Copy a backup code to move it to another one, or paste one here to restore it.</p>
    <div class="k-row">
      <button id="copy-btn" class="k-btn k-btn--primary">Copy backup code</button>
      <button id="share-btn" class="k-btn">Share…</button>
    </div>
    <textarea id="code" placeholder="Paste a backup code here to restore" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div class="k-row">
      <button id="restore-btn" class="k-btn" disabled>Restore from code</button>
      <button id="close-btn" class="k-btn">Close</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script src="kit/kit.js"></script>
<script src="menu-art.js"></script>
<script>
(function () {
  /* Every game gets a tile. `stat` is a localStorage key the game writes a
     short progress line to ("Level 12", "Best 3180"); the menu just shows it.
     Art comes from MENU_ART[id] (menu-art.js); `emoji` is the fallback and
     `c1`/`c2` are the tile's gradient. */
  var GAMES = [
    { id: 'color',      name: 'Color by Number', emoji: '🎨', c1: '#ff9f43', c2: '#ff7ac6', href: 'games/color/index.html' },
    { id: 'watersort',  name: 'Water Sort',      emoji: '🧪', c1: '#4cc2ff', c2: '#2ee6c9', href: 'games/watersort/index.html' },
    { id: 'blockblast', name: 'Block Blast',     emoji: '🧱', c1: '#a77bff', c2: '#4c7dff', href: 'games/blockblast/index.html' },
    { id: '2048',       name: '2048',            emoji: '🔢', c1: '#ffd23f', c2: '#ff9f43', href: 'games/2048/index.html', isNew: true },
    { id: 'memory',     name: 'Memory Match',    emoji: '🃏', c1: '#2ee6c9', c2: '#a77bff', href: 'games/memory/index.html', isNew: true },
    { id: 'nonogram',   name: 'Picture Puzzles', emoji: '🖼️', c1: '#7f8cff', c2: '#c3c9ff', href: 'games/nonogram/index.html', isNew: true },
    { id: 'flow',       name: 'Flow',            emoji: '🔗', c1: '#ff5d73', c2: '#ffb35c', href: 'games/flow/index.html', isNew: true },
    { id: 'simon',      name: 'Simon',           emoji: '🎵', c1: '#3b418f', c2: '#a77bff', href: 'games/simon/index.html', isNew: true },
    { id: 'shapes',     name: 'Shape Fit',       emoji: '🧩', c1: '#4cc2ff', c2: '#a77bff', href: 'games/shapes/index.html', isNew: true },
    { id: 'dots',       name: 'Dot to Dot',      emoji: '🔵', c1: '#ff7ac6', c2: '#a77bff', href: 'games/dots/index.html', isNew: true },
    { id: 'maze',       name: 'Maze',            emoji: '🐭', c1: '#3ddc84', c2: '#129a86', href: 'games/maze/index.html', isNew: true },
    { id: 'connect4',   name: 'Four in a Row',   emoji: '🔴', c1: '#7fd0ff', c2: '#4c7dff', href: 'games/connect4/index.html', isNew: true },
    { id: 'jigsaw',     name: 'Jigsaw',          emoji: '🧩', c1: '#ff7ac6', c2: '#4cc2ff', href: 'games/jigsaw/index.html', isNew: true },
    { id: 'minigolf',   name: 'Mini Golf',       emoji: '⛳', c1: '#4cc2ff', c2: '#3ddc84', href: 'games/minigolf/index.html', isNew: true }
  ];

  /* Action games live in their own "cabinet" section: timers, lives, high
     scores. Kept apart so the puzzle games above stay calm. */
  var ACTION = [
    { id: 'breakout', name: 'Breakout',        emoji: '🧱', href: 'games/breakout/index.html', isNew: true },
    { id: 'snake',    name: 'Snake',           emoji: '🐍', href: 'games/snake/index.html', isNew: true },
    { id: 'missile',  name: 'Missile Command', emoji: '🚀', href: 'games/missile/index.html', isNew: true },
    { id: 'frogger',  name: 'Frogger',         emoji: '🐸', href: 'games/frogger/index.html', isNew: true },
    { id: 'invaders', name: 'Space Invaders',  emoji: '👾', href: 'games/invaders/index.html', isNew: true },
    { id: 'pong',     name: 'Pong',            emoji: '🏓', href: 'games/pong/index.html', isNew: true },
    { id: 'asteroids',name: 'Asteroids',       emoji: '☄️', href: 'games/asteroids/index.html', isNew: true },
    { id: 'bee',      name: 'Busy Bee',        emoji: '🐝', href: 'games/bee/index.html', isNew: true }
  ];

  /* Card games sit on their own strip of felt. `corner` is the rank shown in
     the card's corner and `cornerColor` its colour.
     ---- CARD GAME SLOTS: add new card games here (Go Fish, Klondike, …),
     with a MENU_ART entry (60 x 84 card face) in menu-art.js. ---- */
  var CARDS = [
    { id: 'crazy8', name: 'Crazy Eights', emoji: '🌈', corner: '8', href: 'games/crazy8/index.html', isNew: true },
    { id: 'gofish', name: 'Go Fish', emoji: '🎣', corner: '🐟', href: 'games/gofish/index.html', isNew: true },
    { id: 'hatch', name: 'Hatch Match', emoji: '🐣', corner: '🥚', href: 'games/hatch/index.html', isNew: true },
    { id: 'klondike', name: 'Solitaire', emoji: '🃏', corner: 'A', cornerColor: '#22252e', href: 'games/klondike/index.html', isNew: true }
  ];

  function get(k) { return Kit.raw(k); }
  // Older Color by Number builds saved the stat JSON-encoded, quotes and all.
  function statOf(id) { var s = get('arcade.stat.' + id); return s && s.charAt(0) === '"' ? s.slice(1, -1) : s; }
  function set(k, v) { Kit.setRaw(k, v); }

  /* Opening a tile records it as seen (hides its NEW badge) and as the last
     game played (drives the "Keep playing" shortcut). */
  function noteOpened(id) { set('arcade.seen.' + id, '1'); set('arcade.last', id); }
  function bindOpen(a, id) {
    a.addEventListener('click', function () { noteOpened(id); Kit.sfx.tap(); });
  }
  function isFresh(g, stat) { return !!g.isNew && !stat && !get('arcade.seen.' + g.id); }

  function artFor(g) {
    var f = window.MENU_ART && MENU_ART[g.id];
    if (f) { try { return f(); } catch (e) {} }
    var s = document.createElement('span');
    s.textContent = g.emoji;
    return s.outerHTML;
  }

  function kindOf(id) {
    for (var i = 0; i < ACTION.length; i++) if (ACTION[i].id === id) return 'cab';
    for (var j = 0; j < CARDS.length; j++) if (CARDS[j].id === id) return 'card';
    return 'puzzle';
  }

  function renderResume() {
    var slot = document.getElementById('resume-slot');
    slot.innerHTML = '';
    var last = get('arcade.last'), g = null;
    GAMES.concat(ACTION, CARDS).forEach(function (x) { if (x.id === last) g = x; });
    if (!g) return;
    var kind = kindOf(g.id);
    var a = document.createElement('a');
    a.className = 'resume'; a.href = g.href;
    a.setAttribute('aria-label', 'Keep playing ' + g.name);
    a.innerHTML = '<span class="r-art ' + kind + '" aria-hidden="true"></span><span class="r-text"><div class="r-top">KEEP PLAYING</div><div class="r-name"></div></span><span class="r-go" aria-hidden="true">' + Kit.icon('play') + '</span>';
    var art = a.querySelector('.r-art');
    art.innerHTML = artFor(g);
    if (kind === 'puzzle') art.style.background = 'linear-gradient(140deg,' + g.c1 + ',' + g.c2 + ')';
    a.querySelector('.r-name').textContent = g.name;
    bindOpen(a, g.id);
    slot.appendChild(a);
  }

  function renderTiles() {
    renderResume();

    var root = document.getElementById('games');
    root.innerHTML = '';
    GAMES.forEach(function (g, i) {
      var a = document.createElement('a');
      a.className = 'tile'; a.href = g.href;
      a.style.setProperty('--i', i);
      var stat = statOf(g.id);
      a.innerHTML =
        '<div class="tile-art" aria-hidden="true"></div>' + (isFresh(g, stat) ? '<span class="badge-new">NEW</span>' : '') +
        '<div class="tile-meta"><div class="tile-name"></div><div class="tile-stat' + (stat ? ' has' : '') + '"></div></div>';
      var art = a.querySelector('.tile-art');
      art.style.setProperty('--c1', g.c1); art.style.setProperty('--c2', g.c2);
      art.innerHTML = artFor(g);
      a.querySelector('.tile-name').textContent = g.name;
      a.querySelector('.tile-stat').textContent = stat || 'Not played yet';
      a.setAttribute('aria-label', g.name + ', ' + (stat || 'not played yet'));
      bindOpen(a, g.id);
      root.appendChild(a);
    });

    var cab = document.getElementById('cabinet');
    cab.innerHTML = '';
    ACTION.forEach(function (g) {
      var a = document.createElement('a');
      a.className = 'cab'; a.href = g.href; a.id = 'cab-' + g.id;
      var stat = statOf(g.id);
      a.innerHTML = '<div class="cab-top"></div><div class="cab-screen" aria-hidden="true"></div><div class="cab-deck" aria-hidden="true"><b></b><i></i><i></i></div><div class="cab-stat"></div>';
      a.querySelector('.cab-screen').innerHTML = artFor(g);
      a.querySelector('.cab-top').textContent = g.name;
      a.querySelector('.cab-stat').textContent = stat || (isFresh(g, stat) ? 'NEW!' : 'INSERT COIN');
      a.setAttribute('aria-label', g.name + (stat ? ', ' + stat : ''));
      bindOpen(a, g.id);
      cab.appendChild(a);
    });

    var cardRow = document.getElementById('card-games');
    cardRow.innerHTML = '';
    CARDS.forEach(function (g) {
      var a = document.createElement('a');
      a.className = 'ctile'; a.href = g.href;
      var stat = statOf(g.id);
      a.innerHTML = '<div class="ctile-stack" aria-hidden="true"><div class="ctile-back"></div><div class="ctile-card"></div></div><div class="ctile-name"></div><div class="ctile-stat"></div>';
      var card = a.querySelector('.ctile-card');
      card.innerHTML = artFor(g) + (g.corner ? '<span class="ctile-corner"></span>' : '');
      if (g.corner) {
        card.querySelector('.ctile-corner').textContent = g.corner;
        if (g.cornerColor) card.style.setProperty('--corner', g.cornerColor);
      }
      a.querySelector('.ctile-name').textContent = g.name;
      a.querySelector('.ctile-stat').textContent = stat || (isFresh(g, stat) ? 'NEW' : '');
      a.setAttribute('aria-label', g.name + (stat ? ', ' + stat : ''));
      bindOpen(a, g.id);
      cardRow.appendChild(a);
    });
  }
  renderTiles();
  // Back-swipe from a game restores this page from the bfcache: refresh the
  // stats then, but not on the first load (that would restart the tile animation).
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderTiles(); });

  /* ---- offline readiness ---- */
  var pill = document.getElementById('offline'), pillText = document.getElementById('offline-text');
  function setPill(cls, text) { pill.className = 'pill-status ' + cls; pillText.textContent = text; }

  /* The installed version is the name of the cache the worker filled. */
  function showVersion() {
    if (!('caches' in window)) return;
    caches.keys().then(function (keys) {
      var v = keys.filter(function (k) { return k.indexOf('arcade-v') === 0; }).sort().pop();
      document.getElementById('version').textContent = v ? 'Installed: ' + v.replace('arcade-', '') : '';
    }).catch(function () {});
  }

  function checkOffline() {
    showVersion();
    if (!('caches' in window) || !('serviceWorker' in navigator)) { setPill('', 'Online only'); return; }
    // The service worker writes __precache after installing: "got/total" files.
    caches.match('./__precache').then(function (r) { return r ? r.text() : null; }).then(function (t) {
      if (!t) { setPill('', 'Preparing offline…'); return; }
      var p = t.split('/'), got = +p[0], total = +p[1];
      if (!(total > 0)) { setPill('', 'Preparing offline…'); return; }
      if (got >= total) setPill('ok', 'Ready offline');
      else setPill('partial', 'Offline: ' + got + '/' + total + ' files');
    }).catch(function () { setPill('', 'Online only'); });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        checkOffline();
        // When a new worker installs, re-check once it has finished.
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'activated') checkOffline(); });
        });
      }).catch(function () { setPill('', 'Online only'); });
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'precached') checkOffline();
      });
      setTimeout(checkOffline, 3000);

      // "Update now": ask the worker to check for a new version, then reload
      // once the new one takes over. Handy when a device seems stuck.
      var updateBtn = document.getElementById('update-btn');
      var reloaded = false, hadController = !!navigator.serviceWorker.controller;
      // Only reload when an existing controller is swapped (not on first-install claim).
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !reloaded && updateBtn.disabled) { reloaded = true; location.reload(); }
        hadController = true;
      });
      updateBtn.addEventListener('click', function () {
        if (updateBtn.disabled) return;
        updateBtn.disabled = true;
        updateBtn.textContent = 'Checking…';
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (!reg) { location.reload(); return; }
          return reg.update().then(function () {
            setTimeout(function () {
              if (reloaded) return;
              updateBtn.textContent = 'Up to date';
              setTimeout(function () { updateBtn.textContent = 'Update now'; updateBtn.disabled = false; }, 2000);
              checkOffline();
            }, 4000);
          });
        }).catch(function () { location.reload(); });
      });
      window.addEventListener('online', checkOffline);
    });
  } else {
    setPill('', 'Online only');
    document.getElementById('update-btn').addEventListener('click', function () { location.reload(); });
  }

  /* ---- backup & restore ----
     A backup code is base64 JSON of every saved key. It's meant to be pasted
     into Messages or Notes, not typed, so length isn't a concern. */
  var PREFIX = 'ARCADE1:';
  var sheet = document.getElementById('sheet');
  var code = document.getElementById('code');
  var msg = document.getElementById('msg');

  function say(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }

  function allKeys() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        out[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return out;
  }

  function encode() {
    var json = JSON.stringify({ v: 1, t: Date.now(), d: allKeys() });
    return PREFIX + btoa(unescape(encodeURIComponent(json)));
  }

  function decode(text) {
    text = (text || '').replace(/\s+/g, '');
    if (text.length > 6000000) throw new Error('too big');
    var i = text.indexOf(PREFIX);
    if (i < 0) throw new Error('not a backup code');
    var json = decodeURIComponent(escape(atob(text.slice(i + PREFIX.length))));
    var obj = JSON.parse(json);
    if (!obj || obj.v !== 1 || !obj.d || typeof obj.d !== 'object' || Array.isArray(obj.d)) throw new Error('bad version');
    Object.keys(obj.d).forEach(function (k) { if (typeof obj.d[k] !== 'string') throw new Error('bad value'); });
    return obj;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      code.value = text; code.focus(); code.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
    });
  }

  document.getElementById('backup-btn').addEventListener('click', function () {
    sheet.classList.remove('hidden'); code.value = ''; say('');
    document.getElementById('share-btn').classList.toggle('hidden', !navigator.share);
  });
  document.getElementById('close-btn').addEventListener('click', function () { sheet.classList.add('hidden'); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.classList.add('hidden'); });

  document.getElementById('copy-btn').addEventListener('click', function () {
    var text = encode();
    copyText(text).then(function () {
      say('Copied. Paste it into Notes or a message to keep it safe.', 'ok');
    }, function () {
      code.value = text; code.select();
      say('Select the code above and copy it.', '');
    });
  });

  document.getElementById('share-btn').addEventListener('click', function () {
    navigator.share({ title: 'Arcade backup', text: encode() }).catch(function () {});
  });

  code.addEventListener('input', function () {
    document.getElementById('restore-btn').disabled = code.value.indexOf(PREFIX) < 0;
  });

  document.getElementById('restore-btn').addEventListener('click', function () {
    var obj;
    try { obj = decode(code.value); } catch (e) { say("That doesn't look like a backup code.", 'bad'); return; }
    var n = Object.keys(obj.d).length;
    var when = obj.t ? new Date(obj.t).toLocaleDateString() : 'unknown date';
    if (!n) { say('That backup is empty, so nothing was changed.', 'bad'); return; }
    Kit.confirm({
      title: 'Replace all progress?', emoji: '💾', danger: true, yes: 'Replace', no: 'Cancel',
      text: 'Everything on this device becomes the backup from <b>' + Kit.esc(when) + '</b> (' + n + ' items). This cannot be undone.'
    }).then(function (yes) { if (yes) restore(obj, n); });
  });

  function restore(obj, n) {
    // Snapshot first so a failed write (storage full) rolls back instead of losing progress.
    var before = allKeys();
    try {
      localStorage.clear();
      Object.keys(obj.d).forEach(function (k) { localStorage.setItem(k, obj.d[k]); });
    } catch (e) {
      try {
        localStorage.clear();
        Object.keys(before).forEach(function (k) { localStorage.setItem(k, before[k]); });
      } catch (e2) {}
      say('Could not write to storage, so nothing was changed.', 'bad'); return;
    }
    say('Restored ' + n + ' items.', 'ok');
    code.value = '';
    document.getElementById('restore-btn').disabled = true;
    renderTiles();
  }

  window.__arcade = { GAMES: GAMES, ACTION: ACTION, CARDS: CARDS, encode: encode, decode: decode };
})();
</script>
</body>
</html>
